# Converted from .github/workflows/release.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: release
'on':
  push:
    tags:
    - v*
  # Run by hand to retry a tag's release from main, with the tag in the field
  # (a tag made before this trigger existed has no workflow_dispatch of its own).
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z); empty for the tag chosen above
        type: string
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Check the tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a release tag: name one in the tag field"; exit 1 ;;
        esac
    - name: Checkout
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0
        lfs: true
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Extract version from tag
      id: version
      run: |
        TAG="${{ inputs.tag || github.ref_name }}"
        echo "✅ Tag: $TAG"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
          echo "❌ Invalid tag format: $TAG (expected: v1.2.3 or similar)"
          exit 1
        fi

        VERSION="${TAG#v}"
        echo "🏷️ Tag: $TAG"
        echo "📦 Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG=$TAG" >> $GITHUB_ENV
    - name: Update version
      run: |
        sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
      shell: bash
    - name: Cache pip packages
      uses: https://github.com/actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e .
        pip uninstall -y unbabelizer
    - name: Build package
      run: python -m build
    # twine, not pypa/gh-action-pypi-publish: that action is a Docker container, to which
    # Forgejo's runner does not pass the step summary's file, and it fails writing there.
    - name: Publish package
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python3 -m pip install --quiet twine
        python3 -m twine upload --disable-progress-bar --skip-existing dist/*
    - name: Collect the release files
      # The tag's commit, for the release: forgejo-release refuses a tag that points
      # elsewhere than the commit it is given, by default the run's (a retry from main).
      id: release_files
      shell: bash
      env:
        TAG: ${{ env.TAG }}
      run: |
        mkdir -p .forgejo-release
        cp dist/* .forgejo-release/
        git fetch --quiet --force origin "+refs/tags/$TAG:refs/tags/$TAG"
        echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
    - name: Write the release notes
      id: release_notes
      shell: bash
      env:
        TAG: ${{ env.TAG }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags
        else
          git fetch --quiet --tags
        fi
        previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
        notes=$(awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; gsub(/^\[|\]$/, "", h); sub(/^v/, "", h)
          if (h == v) { found = 1; next } } found' CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)
        if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
          notes=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG")
        fi
        {
          echo 'notes<<END_OF_NOTES'
          printf '%s\n' "$notes"
          echo END_OF_NOTES
        } >> "$GITHUB_OUTPUT"
    - name: Publish the release
      uses: https://code.forgejo.org/actions/forgejo-release@v2
      with:
        direction: upload
        url: ${{ github.server_url }}
        repo: ${{ github.repository }}
        tag: ${{ env.TAG }}
        sha: ${{ steps.release_files.outputs.sha }}
        title: ${{ env.TAG }}
        release-dir: .forgejo-release
        prerelease: 'false'
        override: false
        release-notes: ${{ steps.release_notes.outputs.notes }}
